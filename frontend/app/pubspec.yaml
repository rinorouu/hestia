name: hestia_app
description: "Hestia — client mobile untuk self-hosted photo & video storage keluarga."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # HTTP client (multipart upload + progress + interceptors)
  dio: ^5.5.0

  # Penyimpanan token (secure) & preferensi (server URL, non-secret)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Pilih foto/video langsung dari GALERI (multi-select, Photo Picker sistem)
  image_picker: ^1.1.2

  # Thumbnail dengan cache + custom header (Authorization)
  cached_network_image: ^3.4.1

  # Preview video
  video_player: ^2.9.1

  # Buka / simpan hasil download
  open_filex: ^4.5.0
  share_plus: ^7.2.2
  path_provider: ^2.1.3

  # Format tanggal & angka
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generator ikon launcher (bikin semua ukuran dari 1 gambar)
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Konfigurasi ikon app. Ganti assets/icon/hestia.png dengan logo pilihanmu
# (PNG kotak, ideal 1024x1024), lalu jalankan: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/hestia.png"
  min_sdk_android: 21
  adaptive_icon_background: "#12203A"
  adaptive_icon_foreground: "assets/icon/hestia.png"
